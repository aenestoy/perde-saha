  <body>
    <div id="stageWrap"><canvas id="stage"></canvas></div>

    <aside>
      <h1>Perde Stüdyo</h1>

      <section class="group">
        <h2>Oda</h2>
        <div class="options" id="rooms"></div>
      </section>

      <section class="group">
        <h2>Pencere</h2>
        <div class="options" id="windows"></div>
      </section>

      <div id="slots"></div>

      <section class="group">
        <h2>Tavan yüksekliği</h2>
        <div class="options" id="ceilings"></div>
        <p class="hint" id="roomNote" style="margin-top:9px;"></p>
      </section>

      <section class="group">
        <h2>Duvar rengi</h2>
        <div class="options" id="walls"></div>
        <div class="zone-row">
          <input type="color" id="wallPicker" value="#EAE5DC" />
          <p class="hint">İstediğin tonu seçebilirsin.</p>
        </div>
      </section>

      <section class="group">
        <h2>Doğrama rengi</h2>
        <div class="options" id="frames"></div>
        <div class="zone-row">
          <input type="color" id="framePicker" value="#EDEDE9" />
          <p class="hint">Kasa, kanat, pervaz ve denizlik.</p>
        </div>
      </section>

      <section class="group">
        <h2>Kumaşlar</h2>
        <div id="zones"></div>
      </section>
    </aside>

    <div class="hud">
      <p id="status">Yükleniyor…</p>
      <div class="actions">
        <button type="button" id="save" class="primary">Görseli indir</button>
      </div>
    </div>

  </body>
